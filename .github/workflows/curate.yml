name: Curation (Define notebook, code, data locks)

# The correlation id (when given) is part of the run name so a caller that
# dispatched this workflow can find the exact run it started.
run-name: Curate ${{ inputs.spec_file }}${{ inputs.correlation_id != '' && format(' [{0}]', inputs.correlation_id) || '' }}

# -- This workflow ingests notebook, code, and data requirements from the
# -- notebook repositories and computes new constraint resolutions and git
# -- hashes and/or symbolic references.  The completed spec is pushed to GHCR
# -- in a degenerate nbs_* image that only contains metadata.  nbw is able to
# -- download and extract the metadata using Docker and the --docker-xxx
# -- commands which glob on spec names.

on:
  workflow_dispatch:
    inputs:
      spec_file:
        description: 'The path to the wrangler spec file in the notebook repo'
        required: false
        type: string
        default: 'specs/roman/nbw-wrangler-spec.yaml'
      wrangler_owner:
        description: 'The owner of the GitHub nb-wrangler repo to use for the tool'
        required: false
        type: string
        default: spacetelescope
      wrangler_ref:
        description: 'The branch/tag/ref of nb-wrangler to use for the tool'
        required: false
        type: string
        default: 'main'
      correlation_id:
        description: 'Caller-supplied id, echoed in the run name so the caller can find this run'
        required: false
        type: string
        default: ''
      runner_group:
        description: 'Larger-runner group to build and test on, e.g. jwst-pipeline-notebooks-64gb. Empty means ubuntu-24.04'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      spec_file:
        description: 'The path to the wrangler spec file in the notebook repo'
        required: false
        type: string
        default: 'specs/roman/nbw-wrangler-spec.yaml'
      wrangler_owner:
        description: 'The owner of the GitHub nb-wrangler repo to use for the tool'
        required: false
        type: string
        default: spacetelescope
      wrangler_ref:
        description: 'The branch/tag/ref of nb-wrangler to use for the tool'
        required: false
        type: string
        default: 'main'
      correlation_id:
        description: 'Caller-supplied id, echoed in the run name so the caller can find this run'
        required: false
        type: string
        default: ''
      runner_group:
        description: 'Larger-runner group to build and test on, e.g. jwst-pipeline-notebooks-64gb. Empty means ubuntu-24.04'
        required: false
        type: string
        default: ''

defaults:
  run:
    shell: bash

jobs:
  nb-wrangler-curate:
    name: Curate (Define notebooks, code, data)
    # One build per spec at a time.
    concurrency:
      group: curate-${{ inputs.spec_file }}
      cancel-in-progress: false
    # Larger runners are selected by group, not label.  Only the known groups are
    # accepted, so the input cannot inject other runner settings.
    runs-on: ${{ contains(fromJSON('["jwst-pipeline-notebooks-16gb","jwst-pipeline-notebooks-64gb"]'), inputs.runner_group) && fromJSON(format('{{"group":"{0}"}}', inputs.runner_group)) || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write       # Allows GITHUB_TOKEN to push to GHCR
    steps:
      - name: Checkout "Notebook Repo"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so the guard step can compare this branch with main.
          fetch-depth: 0

      # The delivery GitHub Apps can push a branch and start this workflow with
      # their own inputs, and this job holds GHCR write access.  Whatever those
      # Apps can make it run is therefore limited here, before any login.
      #  - Always: values that reach shell later must look like what they claim.
      #  - For the Apps: the spec must live on main or a delivery branch, the tool
      #    must be spacetelescope/nb-wrangler@main, and the branch may differ from
      #    main only under specs/ (scripts and assets cannot be swapped out).
      - name: Limit what the delivery Apps may run
        env:
          ACTOR: ${{ github.triggering_actor }}
          APP_BOT: ${{ vars.RRN_APP_BOT }}
          TEST_APP_BOT: ${{ vars.RRN_TEST_APP_BOT }}
          REF_NAME: ${{ github.ref_name }}
          WRANGLER_OWNER: ${{ inputs.wrangler_owner }}
          WRANGLER_REF: ${{ inputs.wrangler_ref }}
          SPEC_FILE: ${{ inputs.spec_file }}
        run: |
          set -euo pipefail
          [[ "$WRANGLER_OWNER" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]] || { echo "::error::Invalid wrangler_owner"; exit 1; }
          [[ "$WRANGLER_REF" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "::error::Invalid wrangler_ref"; exit 1; }
          if ! [[ "$SPEC_FILE" =~ ^specs/[A-Za-z0-9._/-]{1,150}\.ya?ml$ ]] || [[ "$SPEC_FILE" == *..* ]]; then
            echo "::error::Invalid spec_file"; exit 1
          fi
          if [[ -z "$APP_BOT" && -z "$TEST_APP_BOT" ]]; then
            echo "::warning::RRN_APP_BOT and RRN_TEST_APP_BOT are not set, so the delivery Apps' restrictions are not enforced."
            exit 0
          fi
          if [[ "$ACTOR" != "$APP_BOT" && "$ACTOR" != "$TEST_APP_BOT" ]]; then
            exit 0
          fi
          if [[ "$WRANGLER_OWNER" != spacetelescope || "$WRANGLER_REF" != main ]]; then
            echo "::error::The delivery Apps may only use spacetelescope/nb-wrangler@main."; exit 1
          fi
          if [[ "$REF_NAME" != main && "$REF_NAME" != rrn/* ]]; then
            echo "::error::The delivery Apps may only run this from main or an rrn/ branch (got ${REF_NAME})."; exit 1
          fi
          git fetch --quiet --no-tags origin main
          changed=$(git diff --name-only origin/main...HEAD)
          if [[ -n "$changed" ]] && grep -qvE '^specs/' <<<"$changed"; then
            echo "::error::A delivery branch may only change files under specs/. Changed:"; echo "$changed"; exit 1
          fi

      - name: Set up system tools
        run: |
          git config --global user.email "homer@stsci.edu"
          git config --global user.name "Homer S."

      - name: Configure wrangler spec location, overrides mode, and repos directory
        run: |
          # Primary spec workflow input
          export NBW_SPEC=$GITHUB_WORKSPACE/${{ inputs.spec_file }}
          echo NBW_SPEC=$NBW_SPEC >>$GITHUB_ENV

          # name inside Dockerfile
          echo SPEC_NAME=nbw-wrangler-spec.yaml >>$GITHUB_ENV

          # Define where repo clones should be checked out, must be relative
          export NBW_REPOS_DIR="references"
          echo NBW_REPOS_DIR=$NBW_REPOS_DIR >>$GITHUB_ENV

          # Lock the spec requirements to dev mode (if available) during curation and
          # use dev_overrides:
          export NBW_OVERRIDES_MODE="--dev"
          echo NBW_OVERRIDES_MODE="--dev" >>$GITHUB_ENV

      - name: Checkout and configure wrangler for source repo (can be overridden for --dev)
        run: |
          # Use the bootstrap script from master repo to resolve the target repo; used for bootstrap only
          curl https://raw.githubusercontent.com/${{ inputs.wrangler_owner }}/nb-wrangler/refs/heads/main/nb-wrangler  >nb-wrangler
          chmod +x nb-wrangler

          # Identify the real repo and reference (branch,tag,hash) determining wrangler used for build
          export WRANGLER_URL=https://github.com/${{ inputs.wrangler_owner }}/nb-wrangler.git
          ANS=$(./nb-wrangler resolve-ref ${NBW_SPEC} ${{ inputs.wrangler_ref }})
          export WRANGLER_REF="${ANS}"
          echo WRANGLER_URL=$WRANGLER_URL >> $GITHUB_ENV
          echo WRANGLER_REF=$WRANGLER_REF >> $GITHUB_ENV

          # Clone and configure exact wrangler source code,  nominally a prod copy or a (personal?) dev copy
          cd ${GITHUB_WORKSPACE}/..
          git clone ${WRANGLER_URL} nb-wrangler-tool
          cd nb-wrangler-tool
          git checkout ${WRANGLER_REF}

      - name: Bootstrap Wrangler
        run: |
          # Given the exact version of wrangler source code,  run the full bootstrap to set up a wrangler environment
          cd $GITHUB_WORKSPACE/../nb-wrangler-tool
          ./nb-wrangler bootstrap
          source ./nb-wrangler environment
          micromamba install --yes syft grype

      - name: Validate Wrangler spec for image / environment
        run: |
          cd $GITHUB_WORKSPACE/../nb-wrangler-tool
          source ./nb-wrangler environment
          ./nb-wrangler $NBW_SPEC --spec-validate

      - name: Set up workflow env vars
        run: |
          # Both of owner/repo, e.g. spacetelescope/roman_notebooks
          export IMAGE_REPO=$GITHUB_REPOSITORY
          echo IMAGE_REPO=$IMAGE_REPO >>$GITHUB_ENV
          export IMAGE_ROOT=ghcr.io/$IMAGE_REPO
          echo IMAGE_ROOT=$IMAGE_ROOT >> $GITHUB_ENV

          # Full repo path of degenerate spec-only image, including tag
          ANS=$(./nb-wrangler --spec-name 2>/dev/null )_$GITHUB_RUN_NUMBER
          export SPEC_TAG="${ANS}"
          echo SPEC_TAG=$SPEC_TAG >> $GITHUB_ENV
          echo SPEC_IMAGE_ID=${IMAGE_ROOT}:${SPEC_TAG} >> $GITHUB_ENV

          # Full repo path of executable image, including tag
          ANS=$(./nb-wrangler --spi-image-name 2>/dev/null )_$GITHUB_RUN_NUMBER
          export IMAGE_TAG="${ANS}"
          echo IMAGE_TAG=$IMAGE_TAG  >> $GITHUB_ENV
          echo IMAGE_ID=${IMAGE_ROOT}:${IMAGE_TAG} >> $GITHUB_ENV

          # Nominally which classic mission (roman, tike, jwebbinar) or "wrangler" for generic builds
          # Note that generic builds have very little or no Docker-level customization, such as extra C programs
          # built under Docker using make.  Classic deployments
          ANS=$(yq -r .image_spec_header.deployment_name ${NBW_SPEC})
          export SPEC_DEPLOYMENT="${ANS}"
          echo  SPEC_DEPLOYMENT=$SPEC_DEPLOYMENT >> $GITHUB_ENV

          # Root location for curated data and environment archives, also needed for notebook tests
          source ./nb-wrangler environment
          echo NBW_PANTRY=$NBW_PANTRY >>$GITHUB_ENV

      - name: Install apt packages
        run: |
          #  (Does not fully support all SPI image apt packages,  just spec'ed)
          PACKAGES=$(yq  -r '.apt_packages | join(" ")' $NBW_SPEC)
          sudo apt-get update
          sudo apt-get install --yes $PACKAGES

      - name: Curate Environment
        run: |
            cd $GITHUB_WORKSPACE/../nb-wrangler-tool
            ./nb-wrangler --spec-reset
            ./nb-wrangler --curate

      - name: Curate Data
        run: |
            cd $GITHUB_WORKSPACE/../nb-wrangler-tool
            ./nb-wrangler --data-reset-curation
            ./nb-wrangler --data-curate

      - name: Log in to GHCR
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Generate Dockerfile for spec
        run: |
          cd $GITHUB_WORKSPACE/../nb-wrangler-tool
          mkdir docker-root
          cd docker-root
          cp ${NBW_SPEC} .
          cat > Dockerfile << EOF
          FROM scratch
          COPY $(basename ${NBW_SPEC}) ${SPEC_NAME}
          EOF

      - name: Build Spec archive and push to GHCR
        run: |
          cd $GITHUB_WORKSPACE/../nb-wrangler-tool/docker-root
          docker build -t ${SPEC_IMAGE_ID} -f Dockerfile .
          docker push ${SPEC_IMAGE_ID}

      - name: Build Image and Push to GHCR
        run: |
          set -x
          cd $GITHUB_WORKSPACE/../nb-wrangler-tool
          ./nb-wrangler --clone-repos --spi-inject-reqs --spi-image-build ${NBW_OVERRIDES_MODE}
          docker image ls
          docker tag notebook-${SPEC_DEPLOYMENT}:latest   ${IMAGE_ID}
          docker push ${IMAGE_ID}

      - name: Test imports inside image (adivsory)
        run: |
          cd $GITHUB_WORKSPACE/../nb-wrangler-tool
          source ./nb-wrangler environment
          cd $NBW_REPOS_DIR/science-platform-images

          # make dirs globally writable since uid/gid inside Docker may not match outside
          mkdir -p ${HOME}/crds_cache
          chmod -R 777 ${HOME}/crds_cache
          mkdir -p ${NBW_PANTRY}
          chmod -R 777 ${NBW_PANTRY}

          scripts/image-configure ${SPEC_DEPLOYMENT}
          source setup-env

          image-test --test-imports ${NBW_OVERRIDES_MODE}

      - name: Test notebooks inside image (advisory)
        run: |
          cd $GITHUB_WORKSPACE/../nb-wrangler-tool
          cd $NBW_REPOS_DIR/science-platform-images
          source setup-env
          image-test --test-notebooks ${NBW_OVERRIDES_MODE}
          rm -rf $NBW_REPOS_DIR

      # Machine-readable result for callers.  Workflow outputs are not available
      # for runs started with workflow_dispatch, so an artifact is used instead.
      - name: Record result
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          SPEC_FILE: ${{ inputs.spec_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The registry digest of the image that was just pushed. The caller later makes its alias from this digest.
          DIGEST=$(bash "$GITHUB_WORKSPACE/scripts/image_digest.sh" "${IMAGE_ID}")
          # Build the JSON with jq --arg, which escapes values, instead of pasting them into a string.
          jq -n \
            --arg correlation_id "$CORRELATION_ID" \
            --arg spec_file "$SPEC_FILE" \
            --arg spec_tag "$SPEC_TAG" \
            --arg spec_image_id "$SPEC_IMAGE_ID" \
            --arg image_tag "$IMAGE_TAG" \
            --arg image_id "$IMAGE_ID" \
            --arg image_digest "$DIGEST" \
            --arg wrangler_ref "$WRANGLER_REF" \
            --arg run_url "$RUN_URL" \
            '$ARGS.named' > rrn-result.json
          cat rrn-result.json

      # The artifact is how the caller (another repository's workflow) gets the result.
      - name: Upload result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rrn-result
          path: rrn-result.json
          if-no-files-found: error

      # ----- - name: Scan Image (advisory)
      # -----   run: |
      # -----     cd $GITHUB_WORKSPACE/../nb-wrangler-tool
      # -----     cd $NBW_REPOS_DIR/science-platform-images
      # -----     scripts/image-configure ${SPEC_DEPLOYMENT}
      # -----     source setup-env
      # -----     image-scan
